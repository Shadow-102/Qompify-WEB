<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#06121d" />
    <meta name="description" content="Qompify: skládej PC, ověř kompatibilitu naživo a porovnej ceny v českých e-shopech." />
    <title>Qompify – stavitel PC a srovnávač cen</title>
    <link rel="icon" href="./favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body style="background:#06121d;color:#F3EBDD">
    <div id="root"><p id="boot" style="font:16px system-ui,sans-serif;padding:24px">Načítání Qompify…</p></div>
    <noscript><p style="padding:24px">Qompify potřebuje zapnutý JavaScript.</p></noscript>
    <script>
      addEventListener('error', function (e) {
        var b = document.getElementById('boot');
        if (b) b.textContent = 'Chyba: ' + (e.message || (e.target && (e.target.src || e.target.href)) || 'načtení selhalo');
      }, true);
    </script>
    <script src="./app.js"></script>
  </body>
</html>
